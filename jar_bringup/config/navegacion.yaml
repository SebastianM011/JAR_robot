amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    robot_model_type: nav2_amcl::OmniMotionModel
    tf_broadcast: true
    set_initial_pose: false
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    update_min_d: 0.1
    update_min_a: 0.1

# localizador:=jar
campo_verosimilitud:
  ros__parameters:
    sigma_sensor: 0.2

localizador:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    num_particulas: 300
    escala_avance: 1.0
    escala_giro: 1.0
    submuestreo_scan: 15
    ruido_remuestreo_xy: 0.01
    ruido_remuestreo_theta: 0.01

map_server:
  ros__parameters:
    frame_id: map
    topic_name: map

grilla_cobertura:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    factor_escala: 4
    timeout_scan_s: 0.5
    tiempo_asentamiento_s: 3.0

explorador:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    velocidad_maxima: 0.3
    # Envuelve el chasis desplazado y las ruedas esféricas del URDF de Gazebo.
    largo_robot: 0.37
    ancho_robot: 0.24
    timeout_pose_s: 0.5
    velocidad_pasillo: 0.10
    horizonte_colision_s: 0.8
    desaceleracion_segura: 0.4
    subdivisiones_mapa: 2
    timeout_sin_avance_s: 15.0
    # Las paredes de los mapas miden 10 cm y las de los mundos 2 cm: el mapa
    # ya deja 4 cm de más por lado. Con 5 cm el robot quedaba "bloqueado"
    # al rozar el margen en pasos angostos.
    margen_seguridad: 0.03
    timeout_scan_s: 0.5
    tiempo_asentamiento_s: 3.0
    # Giro de 360° en 8 pasos de 45° con pausas, cada 1.5 m recorridos, para que
    # la cámara frontal (61° de campo visual) mire alrededor. 0 lo desactiva.
    distancia_entre_miradas: 1.5
    pasos_mirada: 8
    pausa_mirada_s: 0.6
    velocidad_mirada: 0.6
    # Obstáculos del scan: se ignoran a menos de 10 cm de una pared del mapa
    # (es la pared vista con error de localización) y se inflan con 2 cm de
    # margen en vez de margen_seguridad. Ver README.
    distancia_pared_conocida: 0.10
    margen_obstaculos_scan: 0.02
    # Si queda dentro del margen de una pared, se aleja despacio hasta la
    # celda libre más cercana (hasta 20 cm) en vez de quedarse detenido.
    radio_escape: 0.20
    velocidad_escape: 0.06
