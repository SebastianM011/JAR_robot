amcl:
  ros__parameters:
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: scan
    robot_model_type: nav2_amcl::OmniMotionModel
    tf_broadcast: true
    set_initial_pose: false
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    update_min_d: 0.1
    update_min_a: 0.1

# localizador:=jar
campo_verosimilitud:
  ros__parameters:
    sigma_sensor: 0.2

localizador:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    num_particulas: 300
    escala_avance: 1.0
    escala_giro: 1.0
    submuestreo_scan: 15

map_server:
  ros__parameters:
    frame_id: map
    topic_name: map

grilla_cobertura:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    factor_escala: 4
    timeout_scan_s: 0.5
    tiempo_asentamiento_s: 3.0

explorador:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    velocidad_maxima: 0.3
    # Envuelve el chasis desplazado y las ruedas esféricas del URDF de Gazebo.
    largo_robot: 0.37
    ancho_robot: 0.24
    timeout_pose_s: 0.5
    velocidad_pasillo: 0.10
    horizonte_colision_s: 0.8
    desaceleracion_segura: 0.4
    subdivisiones_mapa: 2
    timeout_sin_avance_s: 15.0
    margen_seguridad: 0.05
    timeout_scan_s: 0.5
    tiempo_asentamiento_s: 3.0
