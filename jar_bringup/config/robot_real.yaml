# Valores medidos sobre el bag del robot real (semana 10, laberinto_victimas).
# Con el filtro offline sobre el bag, el scan queda a 0-5 cm de las paredes
# durante todo el recorrido; con escalas 1.0 se pierde después de los giros.

campo_verosimilitud:
  ros__parameters:
    sigma_sensor: 0.2

localizador:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    num_particulas: 300
    # El robot arranca cerca del origen, no exactamente ahí.
    pose_inicial_x: 0.0
    pose_inicial_y: 0.0
    pose_inicial_theta: 0.0
    dispersion_inicial_xy: 0.3
    dispersion_inicial_theta: 0.3
    # Avance: 0.744 m según el lidar trasero contra 0.949 m según /odom.
    escala_avance: 0.784
    # Giro: 1076.5° según el IMU contra 1339.0° según /odom. El signo del
    # IMU está invertido (el lidar coincide en signo con /odom), así que la
    # escala es positiva.
    escala_giro: 0.804
    submuestreo_scan: 15
    ruido_remuestreo_xy: 0.01
    ruido_remuestreo_theta: 0.01

detector_scan_color:
  ros__parameters:
    # Mientras el robot gira, la imagen y el scan no son del mismo instante.
    giro_maximo: 0.3

detector_victimas:
  ros__parameters:
    map_frame: map
    umbral_probabilidad: 101.0
    racha_minima: 3
    distancia_minima_valida: 0.25

juntar_victimas:
  ros__parameters:
    victimas: 2
    detecciones_minimas: 30
    radio_grupo: 0.30
    mitad_caja: 0.09
    map_frame: map
    base_frame: base_footprint
